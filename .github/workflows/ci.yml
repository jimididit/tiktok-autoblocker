name: CI

on:
  pull_request:
  pull_request_review:
    types: [submitted]
  push:
    branches: [main]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          # No package.json / lockfile in this repo
          package-manager-cache: false

      - name: Syntax check
        run: |
          node --check chrome-extension/background.js
          node --check chrome-extension/content.js
          node --check chrome-extension/page-world.js
          node --check chrome-extension/popup.js
          node --check tampermonkey/script.js

      - name: Version lockstep
        run: node .github/scripts/check-versions.js

      - name: Manifest sanity
        run: |
          node -e "
          const m = require('./chrome-extension/manifest.json');
          if (m.manifest_version !== 3) throw new Error('manifest_version must be 3');
          for (const key of ['name', 'version', 'description', 'permissions', 'host_permissions', 'content_scripts', 'action', 'background']) {
            if (m[key] == null) throw new Error('missing manifest key: ' + key);
          }
          console.log('manifest ok', m.name, m.version);
          "

      # Ruleset does not require GitHub "approving reviews" for everyone (owner PRs stay mergeable).
      # Outside contributors still need a maintainer APPROVED review before this check goes green.
      - name: Outside contributors need maintainer approval
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAINTAINER: jimididit
        run: |
          if [ "$PR_AUTHOR" = "$MAINTAINER" ]; then
            echo "Maintainer PR; no review required."
            exit 0
          fi
          approvals="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" --jq '[.[] | select(.state == "APPROVED")] | length')"
          if [ "$approvals" -lt 1 ]; then
            echo "Outside contributor PRs need at least one approving review from a maintainer before merge."
            exit 1
          fi
          echo "Found ${approvals} approving review(s)."
